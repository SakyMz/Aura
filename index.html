<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA — Segurança preventiva para mulheres</title>
  <meta name="description" content="AURA: transforme informação da comunidade em inteligência para decisões mais seguras. Informação antes da situação." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238b5cf6'><path d='M12 3c3.5 3.2 6.5 6.6 6.5 10.3A6.5 6.5 0 0 1 12 20a6.5 6.5 0 0 1-6.5-6.7C5.5 9.6 8.5 6.2 12 3z'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#6a3fd0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AURA" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/aura.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="toast-container"></div>

  <!-- LANDING PAGE -->
  <section id="view-landing" class="view">
    <div id="landing-root"></div>
  </section>

  <!-- AUTH (login / cadastro) -->
  <section id="view-auth" class="view auth-view">
    <div id="auth-root"></div>
  </section>

  <!-- APP SHELL (todos os módulos logados) -->
  <section id="view-app" class="view">
    <div id="app-shell" class="app-shell-inner"></div>
  </section>

  <!-- VALIDAÇÃO DE ACESSO (exclusivo para mulheres) -->
  <section id="view-verify" class="view verify-view">
    <div id="verify-root"></div>
  </section>

  <!-- VISUALIZADOR DE LOCALIZAÇÃO AO VIVO (público, via link) -->
  <section id="view-share" class="view">
    <div id="share-root"></div>
  </section>

  <!-- Firestore rules hint -->
  <script src="js/config/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/services/data.js"></script>
  <script src="js/services/map.js"></script>
  <script src="js/services/routing.js"></script>
  <script src="js/components/feedback.js"></script>
  <script src="js/components/report-components.js"></script>
  <script src="js/components/emergency.js"></script>
  <script src="js/router.js"></script>
  <script src="js/pages/landing.js"></script>
  <script src="js/pages/auth.js"></script>
  <script src="js/pages/verify.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/map-page.js"></script>
  <script src="js/pages/report.js"></script>
  <script src="js/pages/my-reports.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/pages/notifications.js"></script>
  <script src="js/pages/trusted-share.js"></script>
  <script src="js/pages/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
